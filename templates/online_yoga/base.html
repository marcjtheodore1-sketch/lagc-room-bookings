<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gentle Yoga with Marlijn | London Autism Group Charity{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=50">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/presentation.css') }}?v=2">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/online-yoga.css') }}">
</head>
<body class="online-yoga">
    <nav class="navbar" aria-label="Charity navigation">
        <a class="yoga-charity-link" href="https://www.londonautismgroupcharity.org/">
            <img class="nav-logo" src="{{ url_for('static', filename='images/lagc_logo.jpg') }}" alt="">
            London Autism Group Charity
        </a>
        <a class="nav-link" href="https://www.londonautismgroupcharity.org/#calendar">Events calendar</a>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <div class="footer-links">
            <a class="footer-link" href="https://www.londonautismgroupcharity.org/contact">Contact us</a>
            <a class="footer-link" href="https://www.londonautismgroupcharity.org/privacy">Privacy</a>
            <a class="footer-link" href="{{ url_for('online_yoga.organiser') }}">Organiser sign-in</a>
        </div>
    </footer>
</body>
</html>
